# Servicios para desarrollo local
# Uso: docker compose -f docker-compose.dev.yml up -d
#
# Nota: Next.js y Supabase NO se dockerizan en dev.
#   - Next.js corre con: npm run dev
#   - Supabase corre con: npx supabase start

services:
  ollama:
    image: ollama/ollama:latest
    container_name: proofday-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
